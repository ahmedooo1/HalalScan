name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # cssnano's postcss-merge-longhand uses Set.prototype.isSubsetOf,
          # only available natively from Node 22 -- Node 20 throws mid-build.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npm run generate

      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH="ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=no"

          # HalalScan is fully static -- no install/build ever runs on the
          # VPS, which is short on RAM. Just sync the generated bundle.
          rsync -az --delete -e "$SSH" .output/public/ "$REMOTE_USER@$HOST:$DEST/"

          rm -f ~/.ssh/deploy_key

      - name: Live check
        run: |
          set -e
          SITE=https://halalscan.aaweb.fr
          curl -fsS "$SITE/" | grep -q 'HalalScan'
          # Le moteur de lecture de texte doit être servi par le site lui-même.
          for f in ocr/worker.min.js ocr/core/tesseract-core-simd-lstm.wasm.js ocr/lang/fra.traineddata.gz; do
            echo "== $f"
            curl -fsS -o /dev/null -D - "$SITE/$f" | grep -iE '^(HTTP|content-type|content-length|content-encoding|content-security-policy|cache-control)'
          done
          echo "== en-têtes de la page"
          curl -fsS -o /dev/null -D - "$SITE/" | grep -iE '^(content-security-policy|cross-origin)' || echo "(pas de CSP)"
